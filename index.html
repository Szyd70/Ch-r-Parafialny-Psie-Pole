<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podgląd PDF</title>
  <!-- Wczytanie biblioteki PDF.js z CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body { margin: 0; background-color: #525659; display: flex; justify-content: center; padding: 20px; }
    #pdf-canvas { background: white; box-shadow: 0 0 10px rgba(0,0,0,0.3); max-width: 100%; height: auto; }
  </style>
</head>
<body>

  <canvas id="pdf-canvas"></canvas>

  <script>
    // Ustawienie worker-a dla PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Podmień na bezpośredni adres URL do swojego pliku PDF
    const url = 'TUTAJ_WKLEJ_BEZPOŚREDNI_LINK_DO_PDF';

    // Pobranie i renderowanie 1. strony
    pdfjsLib.getDocument(url).promise.then(pdf => {
      return pdf.getPage(1);
    }).then(page => {
      const scale = 2.0; // Wyższa skala = ostra jakość nut
      const viewport = page.getViewport({ scale: scale });

      const canvas = document.getElementById('pdf-canvas');
      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      page.render({
        canvasContext: context,
        viewport: viewport
      });
    }).catch(err => {
      console.error('Błąd wczytywania PDF:', err);
    });
  </script>

</body>
</html>
