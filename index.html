<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liturgia Słowa</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent: #4caf50;
            --gold: #ffd700;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 1.6rem;
            color: var(--gold);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 4px solid var(--accent);
        }

        .card-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .card-body {
            line-height: 1.6;
            font-size: 1rem;
            white-space: pre-wrap;
        }

        .status {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: var(--text-muted);
        }

        .btn-reload {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Liturgia Słowa na Jutro</h1>
    </header>

    <div id="status" class="status">Ładowanie czytań...</div>

    <div id="readings-container" style="display: none;">
        <div class="card">
            <div class="card-title">Treść Liturgii</div>
            <div class="card-body" id="main-reading"></div>
        </div>
    </div>

    <button class="btn-reload" onclick="pobierzCzytania()">Odśwież Czytania</button>
</div>

<script>
    async function pobierzCzytania() {
        const statusEl = document.getElementById('status');
        const containerEl = document.getElementById('readings-container');
        
        statusEl.style.display = 'block';
        statusEl.innerText = "Pobieranie przez Vercel Serverless Function...";
        containerEl.style.display = 'none';

        try {
            // Odwołujemy się do bezserwerowej funkcji w Vercel
            const response = await fetch('/api/liturgia');
            
            if (!response.ok) throw new Error("Błąd serwera");

            const data = await response.json();
            
            statusEl.style.display = 'none';
            containerEl.style.display = 'block';
            
            const mainReading = document.getElementById('main-reading');
            mainReading.innerHTML = JSON.stringify(data, null, 2);
        } catch (error) {
            console.error(error);
            statusEl.innerText = "Nie udało się pobrać czytań z Vercel API.";
        }
    }

    window.addEventListener('DOMContentLoaded', pobierzCzytania);
</script>

</body>
</html>
