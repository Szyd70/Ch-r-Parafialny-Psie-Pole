<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liturgia Słowa - Mateusz.pl</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent: #4caf50;
            --gold: #ffd700;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 1.5rem;
            color: var(--gold);
        }

        .date-badge {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-left: 4px solid var(--accent);
        }

        .card-body {
            line-height: 1.6;
            font-size: 1.05rem;
        }

        .card-body p {
            margin-bottom: 12px;
        }

        .card-body b, .card-body strong {
            color: var(--gold);
        }

        .status {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: var(--text-muted);
        }

        .btn-reload {
            display: block;
            margin: 20px auto;
            padding: 12px 24px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="header-title">Liturgia Słowa z Mateusz.pl</h1>
        <div class="date-badge" id="liturgia-date">Pobieranie danych...</div>
    </header>

    <div id="status" class="status">Pobieranie czytań z portalu Mateusz.pl...</div>

    <div id="readings-container" style="display: none;">
        <div class="card">
            <div class="card-body" id="content-body"></div>
        </div>
    </div>

    <button class="btn-reload" onclick="pobierzCzytaniaZMateusza()">Odśwież Czytania</button>
</div>

<script>
    // Formatowanie daty dla Mateusz.pl (np. 2026-09-27 -> 260927 lub rr/mm/dd)
    function getTomorrowDateObj() {
        const d = new Date();
        d.setDate(d.getDate() + 1); // Jutro
        const yy = String(d.getFullYear()).slice(-2);
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const fullDate = `${d.getFullYear()}-${mm}-${dd}`;
        return { yy, mm, dd, fullDate };
    }

    async function pobierzCzytaniaZMateusza() {
        const { yy, mm, dd, fullDate } = getTomorrowDateObj();
        const statusEl = document.getElementById('status');
        const containerEl = document.getElementById('readings-container');
        const contentBody = document.getElementById('content-body');
        const dateBadge = document.getElementById('liturgia-date');

        dateBadge.innerText = `Liturgia na dzień: ${fullDate}`;
        statusEl.style.display = 'block';
        statusEl.innerText = `Pobieranie czytań z Mateusz.pl na jutro (${fullDate})...`;
        containerEl.style.display = 'none';

        // Sprawdź najpierw pamieć podręczną (Offline Cache)
        const cached = localStorage.getItem(`mateusz_readings_${fullDate}`);
        if (cached) {
            contentBody.innerHTML = cached;
            statusEl.style.display = 'none';
            containerEl.style.display = 'block';
            console.log("Załadowano z pamięci podręcznej (Offline)");
        }

        // Adres czytań na Mateusz.pl (np. https://mateusz.pl/czytania/2026/20260927.htm lub czytania/260927.htm)
        const mateuszUrl = `https://mateusz.pl/czytania/${getTomorrowDateObj().yy}${mm}${dd}.htm`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(mateuszUrl)}`;

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error("Błąd sieci podczas łączenia z proxy.");

            const data = await response.json();
            
            if (data && data.contents) {
                // Konwersja surowego tekstu HTML ze strony Mateusz.pl
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');

                // Wyciągnij treść z głównego kontenera strony Mateusza
                const mainContent = doc.querySelector('body') || doc.documentElement;

                // Usuń zbędne skrypty, linki i nawigację
                mainContent.querySelectorAll('script, style, iframe, nav, header, footer').forEach(el => el.remove());

                let cleanedHtml = mainContent.innerHTML;

                if (cleanedHtml && cleanedHtml.length > 100) {
                    // Zapisz wyczyszczoną treść w LocalStorage (offline)
                    localStorage.setItem(`mateusz_readings_${fullDate}`, cleanedHtml);
                    
                    contentBody.innerHTML = cleanedHtml;
                    statusEl.style.display = 'none';
                    containerEl.style.display = 'block';
                } else {
                    throw new Error("Pusta treść czytań.");
                }
            } else {
                throw new Error("Brak danych z Mateusza.");
            }
        } catch (error) {
            console.error("Błąd pobierania:", error);
            
            if (!cached) {
                statusEl.innerText = "Nie udało się pobrać czytań z Mateusz.pl. Sprawdź połączenie z Internetem.";
            }
        }
    }

    // Uruchom od razu przy wejściu na stronę
    window.addEventListener('DOMContentLoaded', pobierzCzytaniaZMateusza);
</script>

</body>
</html>
