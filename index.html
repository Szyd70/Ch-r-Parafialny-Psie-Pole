<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Odtwarzacz Nagrań Chóralnych</title>

  <!-- Cache-Control -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      padding: 12px;
      padding-bottom: 40px;
    }

    header {
      position: sticky;
      top: 0;
      background-color: rgba(10, 10, 10, 0.96);
      backdrop-filter: blur(10px);
      padding: 10px 0 14px 0;
      z-index: 20;
      border-bottom: 1px solid #262626;
      margin-bottom: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f5f5f5;
      text-transform: uppercase;
      text-align: center;
      flex: 1;
    }

    .icon-btn {
      background-color: #141414;
      border: 1px solid #333333;
      color: #e5e5e5;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .icon-btn:active {
      background-color: #262626;
      transform: scale(0.95);
    }

    .search-container {
      margin-bottom: 8px;
    }

    .search-bar {
      width: 100%;
      padding: 11px 14px;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid #333333;
      background-color: #141414;
      color: #ffffff;
      outline: none;
    }

    .search-bar:focus {
      border-color: #38bdf8;
    }

    /* Lista audio */
    .audio-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .audio-card {
      background-color: #141414;
      border: 1px solid #262626;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .audio-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .audio-title {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      word-break: break-word;
    }

    .voice-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      white-space: nowrap;
      background-color: #1e293b;
      color: #38bdf8;
      border: 1px solid #0284c7;
    }

    .voice-badge.sopran { background-color: #312e81; color: #a5b4fc; border-color: #6366f1; }
    .voice-badge.alt { background-color: #831843; color: #fbcfe8; border-color: #db2777; }
    .voice-badge.tenor { background-color: #064e3b; color: #a7f3d0; border-color: #059669; }
    .voice-badge.bas { background-color: #78350f; color: #fde68a; border-color: #d97706; }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 6px;
      outline: none;
    }

    .status-msg {
      text-align: center;
      padding: 40px 16px;
      color: #737373;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <button class="icon-btn" onclick="loadAudioFiles()">↻ Odśwież</button>
      <h1>Baza Nagrań</h1>
      <span style="font-size: 0.8rem; color: #737373;" id="audioCount">0 plików</span>
    </div>

    <div class="search-container">
      <input type="text" id="searchInput" class="search-bar" placeholder="Szukaj nagrania lub głosu..." />
    </div>
  </header>

  <main>
    <div id="status" class="status-msg">Ładowanie nagrań z Google Drive...</div>
    <div id="audioList" class="audio-list"></div>
  </main>

  <script>
    const FOLDER_ID = '1IJI64LxHW4d1fW2f-AtLq-POs0WnY9Mp';
    const API_KEY = 'AIzaSyDM3V9xJhY4AO2V3MaFN6MZIufi0OqGOCk';

    let allAudioFiles = [];

    async function loadAudioFiles() {
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('audioList');
      statusEl.style.display = 'block';
      statusEl.innerText = 'Ładowanie nagrań z Google Drive...';
      listEl.innerHTML = '';

      const cacheBuster = `&_cb=${Date.now()}`;
      // Szukamy wyłącznie plików audio
      const query = `'${FOLDER_ID}' in parents and trashed = false and mimeType contains 'audio/'`;
      const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType)&pageSize=1000&key=${API_KEY}${cacheBuster}`;

      try {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error('Błąd połączenia z Google Drive API');

        const data = await response.json();
        const files = data.files || [];

        allAudioFiles = files.map(file => parseAudioFile(file));
        allAudioFiles.sort((a, b) => a.cleanTitle.localeCompare(b.cleanTitle, 'pl'));

        document.getElementById('audioCount').innerText = `${allAudioFiles.length} nagrań`;
        statusEl.style.display = 'none';
        renderAudioList();
      } catch (err) {
        console.error('Błąd:', err);
        statusEl.innerText = 'Nie udało się pobrać nagrań. Sprawdź połączenie z siecią.';
      }
    }

    function parseAudioFile(file) {
      const rawName = file.name.replace(/\.(m4a|mp3|wav|ogg|aac)$/i, '').trim();
      const lower = rawName.toLowerCase();

      let voiceLabel = 'Tutti / Nagranie';
      let badgeClass = '';

      if (lower.includes('sopran') || lower.includes(' (s)')) {
        voiceLabel = 'Sopran (S)';
        badgeClass = 'sopran';
      } else if (lower.includes('alt') || lower.includes(' (a)')) {
        voiceLabel = 'Alt (A)';
        badgeClass = 'alt';
      } else if (lower.includes('tenor') || lower.includes(' (t)')) {
        voiceLabel = 'Tenor (T)';
        badgeClass = 'tenor';
      } else if (lower.includes('bas') || lower.includes(' (b)')) {
        voiceLabel = 'Bas (B)';
        badgeClass = 'bas';
      }

      return {
        id: file.id,
        fullName: file.name,
        cleanTitle: rawName,
        voiceLabel: voiceLabel,
        badgeClass: badgeClass,
        streamUrl: `https://drive.google.com/uc?export=download&id=${file.id}`
      };
    }

    function renderAudioList() {
      const container = document.getElementById('audioList');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allAudioFiles.filter(item => 
        item.cleanTitle.toLowerCase().includes(searchTerm) ||
        item.voiceLabel.toLowerCase().includes(searchTerm)
      );

      if (filtered.length === 0) {
        container.innerHTML = '<div class="status-msg">Brak nagrań spełniających kryteria.</div>';
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="audio-card">
          <div class="audio-card-header">
            <div class="audio-title">${item.cleanTitle}</div>
            <span class="voice-badge ${item.badgeClass}">${item.voiceLabel}</span>
          </div>
          <audio controls preload="none" src="${item.streamUrl}"></audio>
        </div>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', renderAudioList);

    // Start
    loadAudioFiles();
  </script>
</body>
</html>
