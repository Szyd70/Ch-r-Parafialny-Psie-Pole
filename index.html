<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Śpiewnik Chóralny - Nuty i Głosy</title>

  <!-- Cache-Control -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      padding: 12px;
      padding-bottom: 40px;
    }

    header {
      position: sticky;
      top: 0;
      background-color: rgba(10, 10, 10, 0.96);
      backdrop-filter: blur(10px);
      padding: 10px 0 14px 0;
      z-index: 20;
      border-bottom: 1px solid #262626;
      margin-bottom: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f5f5f5;
      text-transform: uppercase;
      text-align: center;
      flex: 1;
    }

    .icon-btn {
      background-color: #141414;
      border: 1px solid #333333;
      color: #e5e5e5;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .icon-btn:active {
      background-color: #262626;
      transform: scale(0.95);
    }

    .search-container {
      margin-bottom: 8px;
    }

    .search-bar {
      width: 100%;
      padding: 11px 14px;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid #333333;
      background-color: #141414;
      color: #ffffff;
      outline: none;
    }

    .search-bar:focus {
      border-color: #38bdf8;
    }

    /* Lista Pieśni */
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .song-card {
      background-color: #141414;
      border: 1px solid #262626;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .song-title {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      border-bottom: 1px solid #262626;
      padding-bottom: 8px;
    }

    /* Podgląd Nut JPG */
    .sheet-wrapper {
      width: 100%;
      background-color: #000;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #262626;
      text-align: center;
    }

    .sheet-img {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      cursor: pointer;
    }

    /* Sekcja Głosów / Odtwarzaczy */
    .audio-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #0d0d0d;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #222;
    }

    .audio-section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #a3a3a3;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .audio-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .audio-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background-color: #141414;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #262626;
    }

    .voice-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .voice-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .voice-tutti { color: #38bdf8; }
    .voice-sopran { color: #a5b4fc; }
    .voice-alt { color: #fbcfe8; }
    .voice-tenor { color: #a7f3d0; }
    .voice-bas { color: #fde68a; }

    audio {
      width: 100%;
      height: 36px;
      outline: none;
    }

    /* Modal powiększenia nut */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.95);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    .modal.active { display: flex; }
    .modal img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #262626;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .status-msg {
      text-align: center;
      padding: 40px 16px;
      color: #737373;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <button class="icon-btn" onclick="loadCatalog()">↻ Odśwież</button>
      <h1>Śpiewnik Chóralny</h1>
      <span style="font-size: 0.8rem; color: #737373;" id="songCount">0 pieśni</span>
    </div>

    <div class="search-container">
      <input type="text" id="searchInput" class="search-bar" placeholder="Szukaj pieśni..." />
    </div>
  </header>

  <main>
    <div id="status" class="status-msg">Skandowanie folderów pieśni...</div>
    <div id="songList" class="song-list"></div>
  </main>

  <!-- Modal do powiększania nut -->
  <div id="imageModal" class="modal" onclick="closeModal()">
    <button class="modal-close" onclick="closeModal()">✕ Zamknij</button>
    <img id="modalImg" src="" alt="Nuty" />
  </div>

  <script>
    const MAIN_FOLDER_ID = '1YR4rFWK9-DOZLwguXoQZnzkQkZ6m5vt-';
    const API_KEY = 'AIzaSyDM3V9xJhY4AO2V3MaFN6MZIufi0OqGOCk';

    let allSongs = [];

    async function loadCatalog() {
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('songList');
      statusEl.style.display = 'block';
      statusEl.innerText = 'Ładowanie podfolderów z pieśniami...';
      listEl.innerHTML = '';

      const cacheBuster = `&_cb=${Date.now()}`;
      
      try {
        // 1. Pobierz podfoldery (każdy podfolder to osobny utwór)
        const folderQuery = `'${MAIN_FOLDER_ID}' in parents and trashed = false and mimeType = 'application/vnd.google-apps.folder'`;
        const folderUrl = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(folderQuery)}&fields=files(id,name)&pageSize=100&key=${API_KEY}${cacheBuster}`;

        const folderRes = await fetch(folderUrl, { cache: 'no-store' });
        if (!folderRes.ok) throw new Error('Błąd pobierania folderów');

        const folderData = await folderRes.json();
        const songFolders = folderData.files || [];

        allSongs = [];

        // 2. Dla każdego folderu pobierz jego zawartość (obraz nut + pliki audio)
        for (const folder of songFolders) {
          const filesQuery = `'${folder.id}' in parents and trashed = false`;
          const filesUrl = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(filesQuery)}&fields=files(id,name,mimeType)&pageSize=50&key=${API_KEY}${cacheBuster}`;

          const filesRes = await fetch(filesUrl, { cache: 'no-store' });
          if (filesRes.ok) {
            const filesData = await filesRes.json();
            const files = filesData.files || [];

            const songObj = parseSongFolder(folder.name, files);
            allSongs.push(songObj);
          }
        }

        allSongs.sort((a, b) => a.title.localeCompare(b.title, 'pl'));

        document.getElementById('songCount').innerText = `${allSongs.length} pieśni`;
        statusEl.style.display = 'none';
        renderSongs();
      } catch (err) {
        console.error('Błąd:', err);
        statusEl.innerText = 'Nie udało się pobrać katalogu pieśni.';
      }
    }

    function parseSongFolder(folderName, files) {
      let sheetUrl = null;
      let audioTracks = {
        tutti: null,
        sopran: null,
        alt: null,
        tenor: null,
        bas: null
      };

      files.forEach(file => {
        // Obraz nut JPG/PNG
        if (file.mimeType.includes('image/')) {
          sheetUrl = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&key=${API_KEY}`;
        }

        // Pliki audio
        if (file.mimeType.includes('audio/')) {
          const nameLower = file.name.toLowerCase();
          const streamUrl = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&key=${API_KEY}`;

          if (nameLower.includes('sopran') || nameLower.includes('- s.')) {
            audioTracks.sopran = streamUrl;
          } else if (nameLower.includes('alt') || nameLower.includes('- a.')) {
            audioTracks.alt = streamUrl;
          } else if (nameLower.includes('tenor') || nameLower.includes('- t.')) {
            audioTracks.tenor = streamUrl;
          } else if (nameLower.includes('bas') || nameLower.includes('- b.')) {
            audioTracks.bas = streamUrl;
          } else {
            audioTracks.tutti = streamUrl;
          }
        }
      });

      return {
        title: folderName,
        sheetUrl: sheetUrl,
        audioTracks: audioTracks
      };
    }

    function renderSongs() {
      const container = document.getElementById('songList');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allSongs.filter(song => song.title.toLowerCase().includes(searchTerm));

      if (filtered.length === 0) {
        container.innerHTML = '<div class="status-msg">Brak pieśni spełniających kryteria.</div>';
        return;
      }

      container.innerHTML = filtered.map(song => {
        const { tutti, sopran, alt, tenor, bas } = song.audioTracks;
        const hasAudio = tutti || sopran || alt || tenor || bas;

        return `
          <div class="song-card">
            <div class="song-title">${song.title}</div>

            ${song.sheetUrl ? `
              <div class="sheet-wrapper">
                <img class="sheet-img" src="${song.sheetUrl}" alt="Nuty ${song.title}" onclick="openModal('${song.sheetUrl}')" loading="lazy" />
              </div>
            ` : '<div style="color:#666; font-size:0.85rem;">Brak dołączonych nut (JPG)</div>'}

            ${hasAudio ? `
              <div class="audio-section">
                <div class="audio-section-title">Odtwarzacze głosów:</div>
                <div class="audio-grid">
                  ${tutti ? renderAudioRow('Tutti / Nagranie', 'voice-tutti', tutti) : ''}
                  ${sopran ? renderAudioRow('Sopran (S)', 'voice-sopran', sopran) : ''}
                  ${alt ? renderAudioRow('Alt (A)', 'voice-alt', alt) : ''}
                  ${tenor ? renderAudioRow('Tenor (T)', 'voice-tenor', tenor) : ''}
                  ${bas ? renderAudioRow('Bas (B)', 'voice-bas', bas) : ''}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function renderAudioRow(label, cssClass, url) {
      return `
        <div class="audio-row">
          <div class="voice-label ${cssClass}">${label}</div>
          <audio controls crossorigin="anonymous" preload="metadata" src="${url}"></audio>
        </div>
      `;
    }

    function openModal(url) {
      document.getElementById('modalImg').src = url;
      document.getElementById('imageModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.remove('active');
      document.getElementById('modalImg').src = '';
    }

    document.getElementById('searchInput').addEventListener('input', renderSongs);

    loadCatalog();
  </script>
</body>
</html>
