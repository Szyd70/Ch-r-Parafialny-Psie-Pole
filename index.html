  <script type="module">
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const FOLDER_ID = '1W-9DISbSkwwwOUBXmiBIgcIKbdZqIHA-';
    const API_KEY = 'AIzaSyDM3V9xJhY4AO2V3MaFN6MZIufi0OqGOCk';

    let allSongs = [];
    let currentCategory = 'Wszystkie';
    let editingSongId = null;
    let isAdminLoggedIn = false;

    let customCategories = ['Adwent', 'Boże Narodzenie', 'Wielki Post', 'Wielkanoc', 'Maryjne', 'Ogólne'];
    let songCategoryMap = {};
    let currentRepertuar = JSON.parse(localStorage.getItem('currentRepertuar')) || [];
    let archiwumRepertuarow = [];

    // --- FIRESTORE API ---
    async function loadCloudData() {
      if (!window.useFirestore || !window.db) return;
      try {
        const docRef = doc(window.db, "spiewnik", "config");
        const snap = await getDoc(docRef);
        if (snap.exists()) {
          const data = snap.data();
          if (data.categories) customCategories = data.categories;
          if (data.songCategoryMap) songCategoryMap = data.songCategoryMap;
          if (data.archiwum) archiwumRepertuarow = data.archiwum;
        }
      } catch (e) {
        console.error("Błąd Firestore:", e);
      }
    }

    async function saveCloudData() {
      if (!window.useFirestore || !window.db) return;
      try {
        const docRef = doc(window.db, "spiewnik", "config");
        await setDoc(docRef, {
          categories: customCategories,
          songCategoryMap: songCategoryMap,
          archiwum: archiwumRepertuarow
        });
      } catch (e) {
        console.error("Błąd zapisu Firestore:", e);
      }
    }

    // --- GOOGLE DRIVE API & PARSER ---
    window.loadSongs = async function() {
      await loadCloudData();

      const cacheBuster = `&_cb=${Date.now()}`;
      // Szukamy obrazów (nuty) ORAZ plików audio
      const query = `'${FOLDER_ID}' in parents and trashed = false and (mimeType contains 'image/' or mimeType contains 'audio/')`;
      const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType,thumbnailLink)&pageSize=1000&key=${API_KEY}${cacheBuster}`;

      try {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error('Błąd połączenia z Google Drive API');

        const data = await response.json();
        const files = data.files || [];

        const imageFiles = files.filter(f => f.mimeType.includes('image/'));
        const audioFiles = files.filter(f => f.mimeType.includes('audio/'));

        // Parsowanie obrazów na piosenki
        allSongs = imageFiles.map(file => parseFileData(file));

        // Powiązanie ścieżek dźwiękowych
        attachAudioToSongs(audioFiles);

        allSongs.sort((a, b) => a.cleanTitle.localeCompare(b.cleanTitle, 'pl'));

        renderCategoriesBar();
        renderSongs();
        updateRepertuarBadge();
      } catch (err) {
        console.error(`Błąd Google Drive API: ${err.message}`);
      }
    }

    function parseFileData(file) {
      let rawName = file.name.replace(/\.(jpg|jpeg|png|webp)$/i, '').trim();

      let slideNum = null;
      const slideMatch = rawName.match(/\((\d+)\)/) || rawName.match(/[-_]\s*(\d+)$/);
      if (slideMatch) {
        slideNum = slideMatch[1];
        rawName = rawName.replace(slideMatch[0], '').trim();
      }

      let category = songCategoryMap[file.id];
      if (!category) {
        const lower = file.name.toLowerCase();
        if (lower.includes('adwent')) category = 'Adwent';
        else if (lower.includes('kolęd') || lower.includes('boże narodzenie')) category = 'Boże Narodzenie';
        else if (lower.includes('post') || lower.includes('krzyż')) category = 'Wielki Post';
        else if (lower.includes('wielkanoc')) category = 'Wielkanoc';
        else if (lower.includes('maryj')) category = 'Maryjne';
        else category = 'Ogólne';
      }

      return {
        id: file.id,
        cleanTitle: rawName,
        slideNumber: slideNum,
        category: category,
        audioTracks: []
      };
    }

    function attachAudioToSongs(audioFiles) {
      audioFiles.forEach(audio => {
        const audioName = audio.name.replace(/\.(m4a|mp3|wav|ogg|aac)$/i, '').trim();

        allSongs.forEach(song => {
          if (audioName.toLowerCase().includes(song.cleanTitle.toLowerCase())) {
            let voiceLabel = 'Nagranie / Tutti';
            const lower = audioName.toLowerCase();
            if (lower.includes('sopran') || lower.includes(' (s)')) voiceLabel = 'Sopran (S)';
            else if (lower.includes('alt') || lower.includes(' (a)')) voiceLabel = 'Alt (A)';
            else if (lower.includes('tenor') || lower.includes(' (t)')) voiceLabel = 'Tenor (T)';
            else if (lower.includes('bas') || lower.includes(' (b)')) voiceLabel = 'Bas (B)';

            song.audioTracks.push({
              id: audio.id,
              name: audio.name,
              label: voiceLabel,
              streamUrl: `https://drive.google.com/uc?export=download&id=${audio.id}`
            });
          }
        });
      });
    }

    // --- ADMIN AUTH ---
    window.handleAdminToggle = function() {
      if (isAdminLoggedIn) {
        isAdminLoggedIn = false;
        document.body.classList.remove('is-admin');
        const btn = document.getElementById('adminAuthBtn');
        btn.innerText = '🔑 Zaloguj';
        btn.classList.remove('admin-active');
        alert('Wylogowano z trybu administratora.');
      } else {
        const pass = prompt('Podaj hasło administratora:');
        if (pass === '0410') {
          isAdminLoggedIn = true;
          document.body.classList.add('is-admin');
          const btn = document.getElementById('adminAuthBtn');
          btn.innerText = '🔓 Admin (Wyloguj)';
          btn.classList.add('admin-active');
          alert('Zalogowano jako Administrator! Funkcje edycji są teraz widoczne.');
        } else if (pass !== null) {
          alert('Niepoprawne hasło!');
        }
      }
    }

    // --- WIDOKI I RENDERING ---
    window.renderSongs = function() {
      const gridEl = document.getElementById('songGrid');
      gridEl.innerHTML = '';

      const searchTerm = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allSongs.filter(song => {
        const matchesCategory = (currentCategory === 'Wszystkie') || (song.category === currentCategory);
        const matchesSearch = song.cleanTitle.toLowerCase().includes(searchTerm) || 
                              (song.slideNumber && song.slideNumber.includes(searchTerm));
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        gridEl.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 40px; color:#525252;">Brak pieśni spełniających kryteria.</div>';
        return;
      }

      const timestamp = Date.now();
      filtered.forEach(song => {
        const thumbUrl = `https://lh3.googleusercontent.com/d/${song.id}=s400?v=${timestamp}`;

        const card = document.createElement('div');
        card.className = 'song-card';

        const inRep = currentRepertuar.some(s => s.id === song.id);
        const hasAudio = song.audioTracks && song.audioTracks.length > 0;

        card.innerHTML = `
          <div class="card-img-wrapper" onclick="openModal('${song.id}')">
            <img src="${thumbUrl}" alt="${song.cleanTitle}" loading="lazy" />
            <div class="card-actions-top">
              <button class="add-rep-btn" onclick="event.stopPropagation(); toggleRepertuar('${song.id}')">
                ${inRep ? '✓ W zestawie' : '+ Dodaj'}
              </button>
              <button class="edit-song-btn" onclick="event.stopPropagation(); openEditModal('${song.id}')">✏️</button>
            </div>
          </div>
          <div class="song-info" onclick="openModal('${song.id}')">
            <div class="song-title-center">${song.cleanTitle}</div>
            <div class="song-meta-row">
              <span class="badge-category">${song.category}</span>
              ${song.slideNumber ? `<span class="badge-slide">Slajd #${song.slideNumber}</span>` : ''}
              ${hasAudio ? `<span class="badge-audio">🎧 Audio (${song.audioTracks.length})</span>` : ''}
            </div>
          </div>
        `;

        gridEl.appendChild(card);
      });
    }

    function renderCategoriesBar() {
      const bar = document.getElementById('categoriesBar');
      let html = `<button class="cat-btn ${currentCategory === 'Wszystkie' ? 'active' : ''}" onclick="filterCategory('Wszystkie')">Wszystkie</button>`;
      
      customCategories.forEach(cat => {
        html += `<button class="cat-btn ${currentCategory === cat ? 'active' : ''}" onclick="filterCategory('${cat}')">${cat}</button>`;
      });
      bar.innerHTML = html;
    }

    window.filterCategory = function(cat) {
      currentCategory = cat;
      renderCategoriesBar();
      renderSongs();
    }

    // --- EDYCJA PIEŚNI ---
    window.openEditModal = function(songId) {
      if (!isAdminLoggedIn) return;

      editingSongId = songId;
      const song = allSongs.find(s => s.id === songId);
      if (!song) return;

      document.getElementById('editModalSongTitle').innerText = song.cleanTitle;

      const select = document.getElementById('editCatSelect');
      let html = customCategories.map(c => `<option value="${c}" ${c === song.category ? 'selected' : ''}>${c}</option>`).join('');
      html += `<option value="__NEW__">+ Wpisz własną nową kategorię...</option>`;
      select.innerHTML = html;

      document.getElementById('customCatGroup').style.display = 'none';
      document.getElementById('customCatInput').value = '';
      document.getElementById('editSongModal').classList.add('active');
    }

    window.handleCatSelectChange = function() {
      const select = document.getElementById('editCatSelect');
      const customGroup = document.getElementById('customCatGroup');
      if (select.value === '__NEW__') {
        customGroup.style.display = 'block';
      } else {
        customGroup.style.display = 'none';
      }
    }

    window.saveSongEdit = async function() {
      if (!editingSongId) return;

      const select = document.getElementById('editCatSelect');
      let finalCat = select.value;

      if (finalCat === '__NEW__') {
        const customVal = document.getElementById('customCatInput').value.trim();
        if (!customVal) {
          alert('Wpisz nazwę własnej kategorii!');
          return;
        }
        finalCat = customVal;
        if (!customCategories.includes(finalCat)) {
          customCategories.push(finalCat);
        }
      }

      songCategoryMap[editingSongId] = finalCat;

      const song = allSongs.find(s => s.id === editingSongId);
      if (song) song.category = finalCat;

      await saveCloudData();
      renderCategoriesBar();
      renderSongs();
      closeEditModal();
      alert('Zapisano zmiany w kategorii!');
    }

    window.closeEditModal = function() {
      document.getElementById('editSongModal').classList.remove('active');
      editingSongId = null;
    }

    // --- OBSŁUGA REPERTUARU ---
    window.toggleRepertuar = function(songId) {
      const index = currentRepertuar.findIndex(s => s.id === songId);
      if (index > -1) {
        currentRepertuar.splice(index, 1);
      } else {
        const song = allSongs.find(s => s.id === songId);
        if (song) currentRepertuar.push(song);
      }
      localStorage.setItem('currentRepertuar', JSON.stringify(currentRepertuar));
      updateRepertuarBadge();
      renderSongs();
      renderRepertuarList();
    }

    function updateRepertuarBadge() {
      const count = currentRepertuar.length;
      document.getElementById('repCount').innerText = count;
      document.getElementById('dashRepCount').innerText = count;
    }

    window.renderRepertuarList = function() {
      const container = document.getElementById('repertuarList');
      if (currentRepertuar.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:#525252;">Brak pieśni w zestawie na teraz.</div>';
        return;
      }

      let html = '';
      currentRepertuar.forEach((song, idx) => {
        const hasAudio = song.audioTracks && song.audioTracks.length > 0;
        html += `
          <div class="list-item">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div onclick="openModal('${song.id}')" style="cursor:pointer; flex:1;">
                <strong style="font-size:1rem;">${idx + 1}. ${song.cleanTitle}</strong>
                <div class="song-meta-row" style="justify-content:flex-start; margin-top:4px;">
                  <span class="badge-category">${song.category}</span>
                  ${song.slideNumber ? `<span class="badge-slide">Slajd #${song.slideNumber}</span>` : ''}
                  ${hasAudio ? `<span class="badge-audio">🎧 Audio (${song.audioTracks.length})</span>` : ''}
                </div>
              </div>
              <div style="display:flex; gap:6px;">
                <button class="edit-song-btn" onclick="openEditModal('${song.id}')">✏</button>
                <button class="icon-btn" onclick="toggleRepertuar('${song.id}')">Usuń</button>
              </div>
            </div>

            ${hasAudio ? `
              <div class="audio-player-container" style="margin-top:8px;">
                <div class="audio-player-title">Odtwarzacz:</div>
                ${song.audioTracks.map(track => `
                  <div class="audio-item">
                    <label>${track.label}</label>
                    <audio controls src="${track.streamUrl}"></audio>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      });
      container.innerHTML = html;
    }

    window.clearCurrentRepertuar = function() {
      currentRepertuar = [];
      localStorage.setItem('currentRepertuar', JSON.stringify([]));
      updateRepertuarBadge();
      renderSongs();
      renderRepertuarList();
    }

    window.saveRepertuarToArchiwum = async function() {
      if (currentRepertuar.length === 0) return alert('Repertuar jest pusty!');
      const name = prompt('Podaj nazwę dla tego repertuaru (np. Msza Św. 10:00):');
      if (!name) return;

      archiwumRepertuarow.unshift({
        id: Date.now(),
        date: new Date().toLocaleDateString('pl-PL'),
        title: name,
        songs: [...currentRepertuar]
      });

      await saveCloudData();
      alert('Zapisano w archiwum w chmurze!');
      renderArchiwumList();
    }

    window.renderArchiwumList = function() {
      const container = document.getElementById('archiwumList');
      if (archiwumRepertuarow.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:#525252;">Brak zapisanych repertuarów w chmurze.</div>';
        return;
      }

      let html = '';
      archiwumRepertuarow.forEach(item => {
        html += `
          <div class="admin-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
              <strong>${item.title}</strong>
              <small style="color:#737373;">${item.date}</small>
            </div>
            <div style="font-size:0.85rem; color:#a3a3a3; margin-bottom:12px;">
              ${item.songs.map(s => s.cleanTitle).join(' • ')}
            </div>
            <div style="display:flex; gap:8px;">
              <button class="icon-btn" style="flex:1;" onclick="loadArchivedToCurrent(${item.id})">Wczytaj zestaw</button>
              <button class="icon-btn" onclick="deleteArchived(${item.id})">Usuń</button>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    window.loadArchivedToCurrent = function(id) {
      const item = archiwumRepertuarow.find(a => a.id === id);
      if (item) {
        currentRepertuar = [...item.songs];
        localStorage.setItem('currentRepertuar', JSON.stringify(currentRepertuar));
        updateRepertuarBadge();
        switchView('repertuar');
      }
    }

    window.deleteArchived = async function(id) {
      archiwumRepertuarow = archiwumRepertuarow.filter(a => a.id !== id);
      await saveCloudData();
      renderArchiwumList();
    }

    // --- CZYTANIA LITURGICZNE BREWIARZ.PL ---
    window.loadFullReadings = async function() {
      const container = document.getElementById('readingsContent');
      container.innerHTML = '<div style="text-align:center; padding:40px; color:#a3a3a3;">Ładowanie czytań mszalnych z Brewiarz.pl...</div>';

      try {
        const targetUrl = 'https://brewiarz.pl/rss/msza.xml';
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error('Błąd połączenia z serwerem');

        const json = await response.json();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(json.contents, 'text/xml');

        const item = xmlDoc.querySelector('item');
        if (!item) throw new Error('Brak danych w kanale RSS');

        const title = item.querySelector('title') ? item.querySelector('title').textContent : 'Czytania na dziś';
        const description = item.querySelector('description') ? item.querySelector('description').textContent : '';

        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = description;
        tempDiv.querySelectorAll('a, img').forEach(el => el.remove());

        const now = new Date();
        const dateStr = now.toLocaleDateString('pl-PL');

        container.innerHTML = `
          <div style="margin-bottom: 16px; border-bottom: 1px solid #262626; padding-bottom: 12px; text-align: center;">
            <h2 style="font-family:'Playfair Display',serif; color:#f5f5f5; font-size:1.3rem; margin-bottom: 4px;">${title}</h2>
            <div style="font-size:0.75rem; color:#22c55e; font-weight:700; text-transform:uppercase; letter-spacing: 0.5px;">
              Źródło: Brewiarz.pl (${dateStr})
            </div>
          </div>
          <div class="brewiarz-readings-body">
            ${tempDiv.innerHTML}
          </div>
        `;
      } catch (e) {
        console.error('Błąd pobierania RSS z Brewiarz.pl:', e);
        container.innerHTML = `
          <div style="text-align:center; padding:20px; color:#ef4444;">
            Nie udało się wczytać czytań z serwisu Brewiarz.pl.<br>
            <button class="icon-btn" style="margin-top:12px;" onclick="loadFullReadings()">↻ Spróbuj ponownie</button>
          </div>
        `;
      }
    }

    // --- NAWIGACJA ZAKŁADEK ---
    window.switchView = function(viewName) {
      document.querySelectorAll('.section-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      if (viewName === 'home') {
        document.getElementById('viewHome').classList.add('active');
        document.getElementById('tabHome').classList.add('active');
        document.getElementById('bazaHeaderControls').style.display = 'none';
      }
      if (viewName === 'baza') {
        document.getElementById('viewBaza').classList.add('active');
        document.getElementById('tabBaza').classList.add('active');
        document.getElementById('bazaHeaderControls').style.display = 'block';
      }
      if (viewName === 'repertuar') {
        document.getElementById('viewRepertuar').classList.add('active');
        document.getElementById('tabRepertuar').classList.add('active');
        document.getElementById('bazaHeaderControls').style.display = 'none';
        renderRepertuarList();
      }
      if (viewName === 'czytania') {
        document.getElementById('viewCzytania').classList.add('active');
        document.getElementById('tabCzytania').classList.add('active');
        document.getElementById('bazaHeaderControls').style.display = 'none';
        loadFullReadings();
      }
      if (viewName === 'archiwum') {
        document.getElementById('viewArchiwum').classList.add('active');
        document.getElementById('tabArchiwum').classList.add('active');
        document.getElementById('bazaHeaderControls').style.display = 'none';
        renderArchiwumList();
      }
    }

    // --- MODAL PODGLĄDU ---
    window.openModal = function(songId) {
      const song = allSongs.find(s => s.id === songId);
      if (!song) return;

      const timestamp = Date.now();
      const imageUrl = `https://lh3.googleusercontent.com/d/${song.id}=s2000?v=${timestamp}`;

      document.getElementById('modalTitle').innerText = song.cleanTitle;
      document.getElementById('modalCategory').innerText = song.category;
      document.getElementById('modalSlide').innerText = song.slideNumber ? `Slajd #${song.slideNumber}` : '';
      document.getElementById('modalImage').src = imageUrl;

      const audioSec = document.getElementById('modalAudioSection');
      const audioList = document.getElementById('modalAudioList');

      if (song.audioTracks && song.audioTracks.length > 0) {
        audioSec.style.display = 'block';
        audioList.innerHTML = song.audioTracks.map(track => `
          <div class="audio-item">
            <label>${track.label}</label>
            <audio controls src="${track.streamUrl}"></audio>
          </div>
        `).join('');
      } else {
        audioSec.style.display = 'none';
        audioList.innerHTML = '';
      }

      document.getElementById('imageModal').classList.add('active');
    }

    window.closeModal = function() {
      document.getElementById('imageModal').classList.remove('active');
      document.getElementById('modalImage').src = '';
      
      const modalAudio = document.getElementById('modalAudioList');
      modalAudio.querySelectorAll('audio').forEach(a => a.pause());
      modalAudio.innerHTML = '';
    }

    window.forceRefresh = function() {
      loadSongs();
    }

    document.getElementById('searchInput').addEventListener('input', renderSongs);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js?v=' + Date.now()).catch(err => console.log('SW error:', err));
    }

    loadSongs();
  </script>
</body>
