<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liturgia Słowa</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent: #4caf50;
            --gold: #ffd700;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 1.6rem;
            color: var(--gold);
        }

        .date-badge {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 4px solid var(--accent);
        }

        .card-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .card-body {
            line-height: 1.6;
            font-size: 1rem;
            white-space: pre-wrap;
        }

        .status {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: var(--text-muted);
        }

        .btn-reload {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="swieto-title">Liturgia Słowa</h1>
        <div class="date-badge" id="liturgia-date">Ładowanie...</div>
    </header>

    <div id="status" class="status">Pobieranie czytań liturgicznych...</div>

    <div id="readings-container" style="display: none;">
        <div class="card">
            <div class="card-title">Ewangelia / Czytanie Dnia</div>
            <div class="card-body" id="main-reading"></div>
        </div>
    </div>

    <button class="btn-reload" onclick="pobierzCzytania()">Odśwież Czytania</button>
</div>

<script>
    function getTomorrowDateString() {
        const d = new Date();
        d.setDate(d.getDate() + 1); // Jutro
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}${month}${day}`;
    }

    async function pobierzCzytania() {
        const dateStr = getTomorrowDateString();
        const statusEl = document.getElementById('status');
        const containerEl = document.getElementById('readings-container');
        
        statusEl.style.display = 'block';
        statusEl.innerText = "Pobieranie danych...";
        containerEl.style.display = 'none';

        // 1. Sprawdź pamięć podręczną (Cache)
        const cached = localStorage.getItem(`readings_${dateStr}`);
        if (cached) {
            wyswietl(JSON.parse(cached));
            return;
        }

        // 2. Pobierz z API Evangelizo (darmowe API wspierające język polski)
        try {
            const url = `https://aelf.evangelizo.org/api/v1/reading/pl/${dateStr}`;
            const response = await fetch(url);
            
            if (!response.ok) throw new Error("Błąd sieci");

            const data = await response.json();
            
            if (data && data.data) {
                localStorage.setItem(`readings_${dateStr}`, JSON.stringify(data.data));
                wyswietl(data.data);
            } else {
                throw new Error("Brak danych");
            }
        } catch (error) {
            console.error(error);
            statusEl.innerText = "Nie udało się pobrać czytań. Sprawdź połączenie lub CORS.";
        }
    }

    function wyswietl(data) {
        document.getElementById('status').style.display = 'none';
        document.getElementById('readings-container').style.display = 'block';
        
        const mainReading = document.getElementById('main-reading');
        
        if (Array.isArray(data)) {
            mainReading.innerHTML = data.map(r => `
                <h3 style="color: #ffd700; margin-top: 15px;">${r.title || r.type}</h3>
                <p><b>${r.ref || ''}</b></p>
                <div>${r.text || ''}</div>
            `).join('<hr style="border-color: #333; margin: 20px 0;">');
        } else if (data.text) {
            mainReading.innerHTML = data.text;
        }
    }

    window.addEventListener('DOMContentLoaded', pobierzCzytania);
</script>

</body>
</html>
