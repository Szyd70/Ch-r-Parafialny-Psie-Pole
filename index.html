<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Śpiewnik Chóralny - Pomoce Głosowe</title>
  <style>
    /* Czarno-biały, minimalistyczny motyw */
    :root {
      --bg-color: #ffffff;
      --text-color: #121212;
      --border-color: #cccccc;
      --card-bg: #f9f9f9;
      --button-bg: #121212;
      --button-text: #ffffff;
      --button-hover: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      border-bottom: 2px solid var(--text-color);
      padding-bottom: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1, h2, h3 {
      margin: 0 0 10px 0;
      font-weight: 700;
    }

    button {
      background-color: var(--button-bg);
      color: var(--button-text);
      border: 1px solid var(--button-bg);
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      border-radius: 4px;
    }

    button:hover {
      background-color: var(--button-hover);
    }

    .button-secondary {
      background-color: transparent;
      color: var(--text-color);
      border: 1px solid var(--text-color);
    }

    .button-secondary:hover {
      background-color: #eee;
    }

    /* Sekcja wyboru utworów */
    .song-list {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .song-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    .song-btn.active {
      background-color: var(--button-bg);
      color: var(--button-text);
    }

    /* Formularz dodawania utworu */
    .form-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 6px;
      margin-bottom: 30px;
      display: none;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input[type="text"],
    .form-group textarea,
    .form-group input[type="file"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      background-color: #fff;
    }

    .grid-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    /* Widok utworu */
    .song-view {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* Odtwarzacze głosów */
    .audio-section {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 6px;
    }

    .audio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 10px;
    }

    .audio-item {
      border: 1px solid var(--border-color);
      padding: 10px;
      background-color: #fff;
      border-radius: 4px;
    }

    .audio-item label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
    }

    audio {
      width: 100%;
      height: 36px;
    }

    /* Sekcja nut */
    .sheet-section {
      text-align: center;
      border: 1px solid var(--border-color);
      padding: 10px;
      background-color: #fff;
    }

    .sheet-img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Sekcja tekstu */
    .lyrics-section {
      white-space: pre-wrap;
      font-size: 16px;
      background-color: var(--card-bg);
      padding: 15px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Materiały dla Chóru</h1>
    <button id="toggleFormBtn" class="button-secondary" onclick="toggleForm()">+ Dodaj nowy utwór</button>
  </header>

  <!-- FORMULARZ DODAWANIA UTWORU -->
  <div id="addSongForm" class="form-card">
    <h2>Dodaj nowy utwór do nauki</h2>
    <form id="songForm" onsubmit="saveSong(event)">
      <div class="form-group">
        <label for="title">Tytuł utworu:</label>
        <input type="text" id="title" required placeholder="np. Gaude Mater Polonia">
      </div>

      <div class="form-group">
        <label for="sheet">Plik z nutami (obrazek JPG/PNG):</label>
        <input type="file" id="sheet" accept="image/*" required>
      </div>

      <div class="form-group">
        <label>Pliki audio (.mp3 / .wav):</label>
        <div class="grid-inputs">
          <div>
            <label for="audioSATB">Wszyscy (SATB):</label>
            <input type="file" id="audioSATB" accept="audio/*">
          </div>
          <div>
            <label for="audioS">Sopran (S):</label>
            <input type="file" id="audioS" accept="audio/*">
          </div>
          <div>
            <label for="audioA">Alt (A):</label>
            <input type="file" id="audioA" accept="audio/*">
          </div>
          <div>
            <label for="audioT">Tenor (T):</label>
            <input type="file" id="audioT" accept="audio/*">
          </div>
          <div>
            <label for="audioB">Bas (B):</label>
            <input type="file" id="audioB" accept="audio/*">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="lyrics">Tekst utworu:</label>
        <textarea id="lyrics" rows="5" placeholder="Wpisz tekst pieśni..."></textarea>
      </div>

      <button type="submit">Zapisz utwór</button>
    </form>
  </div>

  <!-- LISTA UTWORÓW -->
  <div class="song-list" id="songButtons"></div>

  <!-- WIDOK WYBRANEGO UTWORU -->
  <div id="songContainer" class="song-view" style="display: none;">
    <h2 id="songTitle"></h2>

    <!-- ODTWARZACZE AUDIO -->
    <div class="audio-section">
      <h3>Odtwarzacze głosów:</h3>
      <div class="audio-grid">
        <div class="audio-item">
          <label>Tutti (SATB)</label>
          <audio id="playerSATB" controls></audio>
        </div>
        <div class="audio-item">
          <label>Sopran (S)</label>
          <audio id="playerS" controls></audio>
        </div>
        <div class="audio-item">
          <label>Alt (A)</label>
          <audio id="playerA" controls></audio>
        </div>
        <div class="audio-item">
          <label>Tenor (T)</label>
          <audio id="playerT" controls></audio>
        </div>
        <div class="audio-item">
          <label>Bas (B)</label>
          <audio id="playerB" controls></audio>
        </div>
      </div>
    </div>

    <!-- PODGLĄD NUT -->
    <div class="sheet-section">
      <h3>Nuty:</h3>
      <img id="sheetImage" class="sheet-img" src="" alt="Podgląd nut">
    </div>

    <!-- TEKST UTWORU -->
    <div>
      <h3>Tekst utworu:</h3>
      <div id="songLyrics" class="lyrics-section"></div>
    </div>
  </div>
</div>

<script>
  let songs = [];
  let currentSongIndex = null;

  function toggleForm() {
    const form = document.getElementById('addSongForm');
    const btn = document.getElementById('toggleFormBtn');
    if (form.style.display === 'block') {
      form.style.display = 'none';
      btn.innerText = '+ Dodaj nowy utwór';
    } else {
      form.style.display = 'block';
      btn.innerText = 'Zamknij formularz';
    }
  }

  // Odczyt pliku do URL (Base64 / Blob URL)
  function readFileAsURL(file) {
    return new Promise((resolve) => {
      if (!file) {
        resolve('');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
  }

  async function saveSong(event) {
    event.preventDefault();

    const title = document.getElementById('title').value;
    const lyrics = document.getElementById('lyrics').value;

    const sheetFile = document.getElementById('sheet').files[0];
    const sheetUrl = await readFileAsURL(sheetFile);

    const satbUrl = await readFileAsURL(document.getElementById('audioSATB').files[0]);
    const sUrl    = await readFileAsURL(document.getElementById('audioS').files[0]);
    const aUrl    = await readFileAsURL(document.getElementById('audioA').files[0]);
    const tUrl    = await readFileAsURL(document.getElementById('audioT').files[0]);
    const bUrl    = await readFileAsURL(document.getElementById('audioB').files[0]);

    const newSong = {
      title,
      sheetUrl,
      lyrics,
      audio: {
        satb: satbUrl,
        s: sUrl,
        a: aUrl,
        t: tUrl,
        b: bUrl
      }
    };

    songs.push(newSong);
    renderSongButtons();
    selectSong(songs.length - 1);

    // Reset formularza
    document.getElementById('songForm').reset();
    toggleForm();
  }

  function renderSongButtons() {
    const container = document.getElementById('songButtons');
    container.innerHTML = '';

    songs.forEach((song, index) => {
      const btn = document.createElement('button');
      btn.className = `song-btn ${index === currentSongIndex ? 'active' : ''}`;
      btn.innerText = song.title;
      btn.onclick = () => selectSong(index);
      container.appendChild(btn);
    });
  }

  function selectSong(index) {
    currentSongIndex = index;
    renderSongButtons();

    const song = songs[index];
    document.getElementById('songContainer').style.display = 'flex';
    document.getElementById('songTitle').innerText = song.title;
    document.getElementById('songLyrics').innerText = song.lyrics || 'Brak wpisanego tekstu.';

    // Nuty
    const sheetImg = document.getElementById('sheetImage');
    sheetImg.src = song.sheetUrl;

    // Przypisanie źródeł audio
    setAudioSource('playerSATB', song.audio.satb);
    setAudioSource('playerS', song.audio.s);
    setAudioSource('playerA', song.audio.a);
    setAudioSource('playerT', song.audio.t);
    setAudioSource('playerB', song.audio.b);
  }

  function setAudioSource(playerId, src) {
    const player = document.getElementById(playerId);
    const parentContainer = player.parentElement;

    if (src) {
      player.src = src;
      parentContainer.style.display = 'block';
    } else {
      player.src = '';
      parentContainer.style.display = 'none'; // Ukrywamy odtwarzacz, jeśli nie dodano ścieżki
    }
  }
</script>

</body>
</html>
